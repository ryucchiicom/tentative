<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=https://rolloff.live/">
  <meta name="theme-color" content="#140a28">
  <title>Roll Off を開く</title>
  <style>
    :root { color-scheme: dark; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 24px; box-sizing: border-box; background: #140a28;
      color: #fff; font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    main { max-width: 520px; }
    a {
      display: inline-block; margin-top: 14px; padding: 13px 22px;
      border-radius: 12px; background: #8b5cf6; color: #fff;
      font-weight: 700; text-decoration: none;
    }
    p { line-height: 1.7; color: #ddd6fe; }
  </style>
  <script>
    // JavaScriptが有効ならブラウザを直接公式サイトへ移動する。
    window.location.replace('https://rolloff.live/');
  </script>
</head>
<body>
  <main>
    <h1>Roll Off を開いています…</h1>
    <p>自動で移動しない場合は、下のリンクをタップしてね。</p>
    <a href="https://rolloff.live/">Roll Off 公式サイトを開く</a>
  </main>
</body>
</html>
