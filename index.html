<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルタイム時計</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: #080b14;
    color: white;
    font-family: "Segoe UI", "Noto Sans JP", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 45%, #172747 0%, transparent 55%),
        linear-gradient(145deg, #080b14, #101a2e 55%, #080b14);
    z-index: -2;
}

.grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(transparent, black 30%, black 70%, transparent);
    z-index: -1;
}

.container {
    width: min(900px, 94vw);
    text-align: center;
    padding: 45px 20px;
}

.label {
    font-size: 14px;
    letter-spacing: 7px;
    color: #8da9d6;
    margin-bottom: 28px;
    text-transform: uppercase;
}

.clock {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(5px, 2vw, 22px);
    font-size: clamp(55px, 13vw, 145px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    white-space: nowrap;
    text-shadow: 0 0 35px #62aaff55;
}

.time-part {
    min-width: 1.35em;
}

.colon {
    color: #6daaff;
    animation: blink 1s infinite;
    transform: translateY(-5px);
}

@keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.35; }
}

.date {
    margin-top: 28px;
    color: #a8bad7;
    font-size: clamp(14px, 3vw, 22px);
    letter-spacing: 3px;
}

.progress-area {
    margin: 55px auto 0;
    width: min(480px, 80%);
}

.progress-bg {
    height: 3px;
    background: #ffffff20;
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #438cff, #8bd9ff);
    box-shadow: 0 0 15px #54aaff;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    color: #7186a8;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 13px;
}

.footer {
    margin-top: 60px;
    color: #61718e;
    font-size: 11px;
    letter-spacing: 3px;
}

.fullscreen {
    position: fixed;
    right: 20px;
    top: 20px;
    padding: 10px 15px;
    color: #9bb8e4;
    background: #ffffff0c;
    border: 1px solid #ffffff20;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
}

.fullscreen:hover {
    background: #ffffff20;
}

@media (max-width: 500px) {
    .container {
        padding: 25px 5px;
    }

    .label {
        letter-spacing: 4px;
        font-size: 11px;
    }

    .date {
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>
<div class="background"></div>
<div class="grid"></div>

<button class="fullscreen" onclick="toggleFullscreen()">
    全画面表示
</button>

<main class="container">
    <div class="label">REAL TIME CLOCK</div>

    <div class="clock">
        <span class="time-part" id="hours">00</span>
        <span class="colon">:</span>
        <span class="time-part" id="minutes">00</span>
        <span class="colon">:</span>
        <span class="time-part" id="seconds">00</span>
    </div>

    <div class="date" id="date">----</div>

    <div class="progress-area">
        <div class="progress-bg">
            <div class="progress" id="progress"></div>
        </div>
        <div class="progress-label">
            <span>SECOND PROGRESS</span>
            <span id="milliseconds">0%</span>
        </div>
    </div>

    <div class="footer">LIVE SYSTEM CLOCK</div>
</main>

<script>
const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");
const seconds = document.getElementById("seconds");
const dateElement = document.getElementById("date");
const progress = document.getElementById("progress");
const milliseconds = document.getElementById("milliseconds");

const pad = n => String(n).padStart(2, "0");

const weekdays = [
    "日曜日", "月曜日", "火曜日",
    "水曜日", "木曜日", "金曜日", "土曜日"
];

let previousSecond = -1;

function updateClock() {
    const now = new Date();

    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    if (previousSecond !== s) {
        hours.textContent = pad(h);
        minutes.textContent = pad(m);
        seconds.textContent = pad(s);

        dateElement.textContent =
            `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日  ${weekdays[now.getDay()]}`;

        previousSecond = s;
    }

    // 1秒間の経過状況を滑らかに表示
    const p = now.getMilliseconds() / 1000 * 100;

    progress.style.width = p + "%";
    milliseconds.textContent = Math.floor(p) + "%";

    requestAnimationFrame(updateClock);
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
}

updateClock();
</script>
</body>
</html>
