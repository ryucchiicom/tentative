<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Touch Effects</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
      }
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { alpha: true });

      let dpr = Math.max(1, window.devicePixelRatio || 1);
      let w = 0;
      let h = 0;

      const state = {
        pointerDown: false,
        pointerId: null,
        startX: 0,
        startY: 0,
        lastX: 0,
        lastY: 0,
        points: [],
        trail: [],
        bursts: [],
        swipes: [],
        loops: []
      };

      const TAP_THRESHOLD = 12;
      const SWIPE_THRESHOLD = 24;
      const LINE_HIT_WIDTH = 18;

      function resize() {
        dpr = Math.max(1, window.devicePixelRatio || 1);
        w = Math.floor(window.innerWidth);
        h = Math.floor(window.innerHeight);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function dist2(ax, ay, bx, by) {
        const dx = ax - bx;
        const dy = ay - by;
        return dx * dx + dy * dy;
      }

      function dist(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function norm(x, y) {
        const len = Math.hypot(x, y) || 1;
        return { x: x / len, y: y / len, len };
      }

      function lineIntersection(a, b, c, d) {
        const rX = b.x - a.x;
        const rY = b.y - a.y;
        const sX = d.x - c.x;
        const sY = d.y - c.y;
        const denom = rX * sY - rY * sX;

        if (Math.abs(denom) < 1e-8) return null;

        const uNumer = (c.x - a.x) * rY - (c.y - a.y) * rX;
        const tNumer = (c.x - a.x) * sY - (c.y - a.y) * sX;
        const t = tNumer / denom;
        const u = uNumer / denom;

        if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
          return {
            x: a.x + t * rX,
            y: a.y + t * rY,
            tA: t,
            tB: u
          };
        }
        return null;
      }

      function addTapBurst(x, y) {
        state.bursts.push({
          x,
          y,
          t: 0,
          life: 520,
          maxR: rand(70, 130)
        });
      }

      function addSwipe(x, y, vx, vy) {
        const n = norm(vx, vy);
        const speed = rand(850, 1200);
        const dirX = n.x;
        const dirY = n.y;

        let tMax = 0;
        const pad = 80;
        if (dirX > 0) tMax = Math.max(tMax, (w + pad - x) / dirX);
        if (dirX < 0) tMax = Math.max(tMax, (0 - pad - x) / dirX);
        if (dirY > 0) tMax = Math.max(tMax, (h + pad - y) / dirY);
        if (dirY < 0) tMax = Math.max(tMax, (0 - pad - y) / dirY);

        const endX = x + dirX * tMax;
        const endY = y + dirY * tMax;

        state.swipes.push({
          x,
          y,
          startX: x,
          startY: y,
          endX,
          endY,
          dirX,
          dirY,
          speed,
          travel: 0,
          dist: Math.hypot(endX - x, endY - y),
          lastTrailX: x,
          lastTrailY: y,
          r: rand(14, 22),
          life: 0
        });
      }

      function addLoop(points) {
        if (points.length < 3) return;
        const poly = points.map(p => ({ x: p.x, y: p.y }));
        state.loops.push({
          points: poly,
          t: 0,
          life: 460
        });
      }

      function pushPoint(x, y) {
        state.points.push({ x, y });

        if (state.points.length < 4) return;

        const n = state.points.length;
        const a = state.points[n - 2];
        const b = state.points[n - 1];

        for (let i = 0; i < n - 3; i++) {
          const c = state.points[i];
          const d = state.points[i + 1];

          if (i === n - 4) continue;

          const hit = lineIntersection(a, b, c, d);
          if (hit) {
            const loopPoints = [{ x: hit.x, y: hit.y }];

            for (let j = i + 1; j < n - 1; j++) {
              loopPoints.push({ x: state.points[j].x, y: state.points[j].y });
            }

            loopPoints.push({ x: hit.x, y: hit.y });

            addLoop(loopPoints);
            state.points = [];
            return;
          }
        }
      }

      function renderBurst(item, alphaScale) {
        const p = item.t / item.life;
        const ease = 1 - Math.pow(1 - p, 3);
        const alpha = Math.max(0, (1 - p) * 0.42 * alphaScale);
        const r = item.maxR * (0.25 + ease * 1.25);

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = `rgba(70, 255, 120, ${alpha})`;
        ctx.fillStyle = `rgba(70, 255, 120, ${alpha * 0.35})`;
        ctx.lineWidth = Math.max(2, 10 * (1 - p));
        ctx.beginPath();
        ctx.arc(item.x, item.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = `rgba(70, 255, 120, ${alpha * 0.55})`;
        ctx.lineWidth = Math.max(1, 2.5 * (1 - p));
        ctx.beginPath();
        ctx.arc(item.x, item.y, r * 1.18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function renderSwipe(item, alphaScale) {
        const p = clamp(item.travel / item.dist, 0, 1);
        const x = item.startX + item.dirX * item.travel;
        const y = item.startY + item.dirY * item.travel;
        const alpha = (1 - Math.pow(p, 1.35)) * 0.42 * alphaScale;

        ctx.save();
        ctx.globalCompositeOperation = "source-over";

        const dx = item.dirX;
        const dy = item.dirY;

        const trailSteps = 16;
        for (let i = 0; i < trailSteps; i++) {
          const back = i * (item.r * 0.72);
          const tx = x - dx * back;
          const ty = y - dy * back;
          const ta = alpha * (1 - i / trailSteps) * 0.75;
          const rr = item.r * (1 - i / (trailSteps * 1.15)) * 0.95;

          if (ta <= 0) continue;

          ctx.fillStyle = `rgba(80, 145, 255, ${ta})`;
          ctx.beginPath();
          ctx.arc(tx, ty, rr, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = `rgba(80, 145, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, item.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function renderLoop(item, alphaScale) {
        const p = item.t / item.life;
        const alpha = 0.42 * (1 - p) * alphaScale;
        const blurAlpha = 0.24 * (1 - p) * alphaScale;

        if (item.points.length < 3) return;

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = `rgba(255, 80, 80, ${alpha})`;
        ctx.strokeStyle = `rgba(255, 80, 80, ${blurAlpha})`;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(item.points[0].x, item.points[0].y);
        for (let i = 1; i < item.points.length; i++) {
          ctx.lineTo(item.points[i].x, item.points[i].y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }

      function update(dt) {
        for (let i = state.bursts.length - 1; i >= 0; i--) {
          const b = state.bursts[i];
          b.t += dt;
          if (b.t >= b.life) state.bursts.splice(i, 1);
        }

        for (let i = state.swipes.length - 1; i >= 0; i--) {
          const s = state.swipes[i];
          s.life += dt;
          s.travel += s.speed * (dt / 1000);

          const curX = s.startX + s.dirX * s.travel;
          const curY = s.startY + s.dirY * s.travel;
          const segment = dist(s.lastTrailX, s.lastTrailY, curX, curY);

          if (segment >= 10) {
            const steps = Math.max(1, Math.floor(segment / 14));
            for (let k = 1; k <= steps; k++) {
              const t = k / steps;
              state.trail.push({
                x: s.lastTrailX + (curX - s.lastTrailX) * t,
                y: s.lastTrailY + (curY - s.lastTrailY) * t,
                r: s.r * rand(0.75, 1.05),
                t: 0,
                life: 360
              });
            }
            s.lastTrailX = curX;
            s.lastTrailY = curY;
          }

          if (
            s.travel > s.dist + 120 ||
            curX < -160 || curX > w + 160 ||
            curY < -160 || curY > h + 160
          ) {
            state.swipes.splice(i, 1);
          }
        }

        for (let i = state.trail.length - 1; i >= 0; i--) {
          const t = state.trail[i];
          t.t += dt;
          if (t.t >= t.life) state.trail.splice(i, 1);
        }

        for (let i = state.loops.length - 1; i >= 0; i--) {
          const l = state.loops[i];
          l.t += dt;
          if (l.t >= l.life) state.loops.splice(i, 1);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);

        const alphaScale = 1;

        for (const t of state.trail) {
          const p = t.t / t.life;
          const alpha = 0.32 * (1 - p) * alphaScale;
          const r = t.r * (0.9 + p * 0.6);

          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = `rgba(80, 145, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (const b of state.bursts) renderBurst(b, alphaScale);
        for (const s of state.swipes) renderSwipe(s, alphaScale);
        for (const l of state.loops) renderLoop(l, alphaScale);

        if (state.pointerDown && state.points.length >= 2) {
          const pts = state.points;
          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = "rgba(255, 80, 80, 0.16)";
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.strokeStyle = "rgba(255, 80, 80, 0.08)";
          ctx.lineWidth = LINE_HIT_WIDTH;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.stroke();
          ctx.restore();
        }
      }

      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min(34, now - lastTime);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function getPos(e) {
        return { x: e.clientX, y: e.clientY };
      }

      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture?.(e.pointerId);
        const p = getPos(e);
        state.pointerDown = true;
        state.pointerId = e.pointerId;
        state.startX = p.x;
        state.startY = p.y;
        state.lastX = p.x;
        state.lastY = p.y;
        state.points = [{ x: p.x, y: p.y }];
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!state.pointerDown || state.pointerId !== e.pointerId) return;
        const p = getPos(e);

        const moved = dist(state.lastX, state.lastY, p.x, p.y);
        if (moved >= 1) {
          pushPoint(p.x, p.y);
          state.lastX = p.x;
          state.lastY = p.y;
        }
      });

      function endPointer(e) {
        if (!state.pointerDown || state.pointerId !== e.pointerId) return;

        const p = getPos(e);
        const total = dist(state.startX, state.startY, p.x, p.y);

        if (state.points.length >= 3) {
          state.points = [];
        }

        if (total < TAP_THRESHOLD) {
          addTapBurst(p.x, p.y);
        } else if (total >= SWIPE_THRESHOLD) {
          addSwipe(state.startX, state.startY, p.x - state.startX, p.y - state.startY);
        }

        state.pointerDown = false;
        state.pointerId = null;
        state.points = [];
      }

      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", resize, { passive: true });

      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
